[package]
name = "zovio-media"
version = "0.1.0"
edition = "2021"

[lib]
name = "zovio_media"
crate-type = ["cdylib"]

[dependencies]
napi = { version = "2.16", default-features = false, features = ["napi8"] }
napi-derive = "2.16"
windows-capture = "1.5"
windows-core = "0.58"

[dependencies.windows]
version = "0.58"
features = [
  "implement",
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Media_Audio",
  "Win32_Media_KernelStreaming",
  "Win32_Media_Multimedia",
  "Win32_System_Com",
  "Win32_System_Com_StructuredStorage",
  "Win32_System_Threading",
  "Win32_System_Variant",
  "Win32_UI_WindowsAndMessaging",
]

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
