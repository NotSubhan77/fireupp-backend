<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Zovio Mobile</title>
  <style>
    body {
      margin: 0;
      min-height: 100dvh;
      background: #09090b;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 24px;
    }
    .card {
      max-width: 340px;
      background: #121316;
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 22px;
      padding: 28px 22px;
    }
    h1 { font-size: 20px; margin: 12px 0 8px; }
    p { font-size: 13.5px; color: #a1a1aa; line-height: 1.5; margin: 0 0 20px; }
    button {
      background: linear-gradient(135deg, #7c5cff 0%, #ff5c8a 100%);
      color: #fff;
      border: none;
      border-radius: 12px;
      padding: 12px 20px;
      font-size: 14px;
      font-weight: 700;
      width: 100%;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Zovio Offline</h1>
    <p>Check your internet connection and tap Retry to connect to your encrypted Zovio workspace.</p>
    <button onclick="window.location.href='https://fireupp.up.railway.app/index.html?app=1'">Retry Connection</button>
  </div>
</body>
</html>
