<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign in to Zovio Desktop</title>
<link rel="icon" type="image/png" href="/zovio_logo.png">
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: radial-gradient(circle at 50% 20%, #171929 0%, #0a0b12 100%);
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .auth-card {
      background: rgba(22, 25, 42, 0.75);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 24px;
      padding: 44px 36px;
      max-width: 460px;
      width: 100%;
      text-align: center;
      box-shadow: 0 24px 64px rgba(0, 0, 0, 0.6), 0 0 0 1px rgba(255, 255, 255, 0.08);
      animation: fadeIn 0.35s cubic-bezier(0.16, 1, 0.3, 1);
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(12px) scale(0.98); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }
    .logo-wrap {
      width: 64px;
      height: 64px;
      margin: 0 auto 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(255, 255, 255, 0.05);
      border-radius: 20px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      box-shadow: 0 8px 24px rgba(255, 59, 0, 0.25);
    }
    h1 {
      font-size: 24px;
      font-weight: 800;
      letter-spacing: -0.4px;
      margin-bottom: 8px;
    }
    .subtitle {
      font-size: 14px;
      color: #94a3b8;
      line-height: 1.5;
      margin-bottom: 24px;
    }
    .google-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      width: 100%;
      padding: 14px 20px;
      border-radius: 14px;
      border: 1px solid rgba(255, 255, 255, 0.18);
      background: #ffffff;
      color: #0f172a;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
      box-shadow: 0 4px 18px rgba(0, 0, 0, 0.3);
    }
    .google-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 28px rgba(255, 255, 255, 0.25);
    }
    .google-btn:active {
      transform: translateY(0);
    }
    .status-badge {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin-top: 16px;
      padding: 14px 18px;
      border-radius: 14px;
      font-size: 14px;
      line-height: 1.45;
    }
    .status-badge.loading {
      background: rgba(255, 255, 255, 0.06);
      color: #cbd5e1;
    }
    .status-badge.success {
      background: rgba(16, 185, 129, 0.15);
      border: 1px solid rgba(16, 185, 129, 0.3);
      color: #34d399;
      font-weight: 600;
    }
    .status-badge.error {
      background: rgba(239, 68, 68, 0.15);
      border: 1px solid rgba(239, 68, 68, 0.3);
      color: #f87171;
    }
    .spinner {
      width: 18px;
      height: 18px;
      border: 2.5px solid rgba(255, 255, 255, 0.2);
      border-top-color: #ff8c00;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    .action-group {
      display: none;
      flex-direction: column;
      gap: 10px;
      margin-top: 20px;
    }
    .primary-btn {
      width: 100%;
      padding: 13px 18px;
      border-radius: 12px;
      border: none;
      background: linear-gradient(135deg, #7c5cff 0%, #ff5c8a 100%);
      color: #ffffff;
      font-size: 14.5px;
      font-weight: 700;
      cursor: pointer;
      text-decoration: none;
      text-align: center;
      box-shadow: 0 4px 16px rgba(124, 92, 255, 0.4);
      transition: all 0.2s ease;
    }
    .primary-btn:hover {
      opacity: 0.94;
      transform: translateY(-1px);
    }
    .secondary-btn {
      width: 100%;
      padding: 11px 18px;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.16);
      background: rgba(255, 255, 255, 0.06);
      color: #cbd5e1;
      font-size: 13.5px;
      font-weight: 600;
      cursor: pointer;
      text-align: center;
      transition: all 0.2s ease;
    }
    .secondary-btn:hover {
      background: rgba(255, 255, 255, 0.12);
      color: #ffffff;
    }
    .auto-close-timer {
      font-size: 12px;
      color: #64748b;
      margin-top: 8px;
    }
    .footer-note {
      margin-top: 24px;
      font-size: 12px;
      color: #64748b;
    }
  </style>
</head>
<body>
  <div class="auth-card">
    <div class="logo-wrap">
      <img src="/zovio_logo.png" width="48" height="48" style="border-radius:14px;display:block;" alt="Zovio">
    </div>

    <h1>Sign in to Zovio</h1>
    <p class="subtitle" id="subtitleText">Authenticate your Google account to return to the native desktop application.</p>

    <button type="button" class="google-btn" id="loginBtn">
      <svg viewBox="0 0 24 24" width="20" height="20">
        <path fill="#EA4335" d="M12 5c1.6 0 3 .6 4.1 1.7l3.1-3.1C17.3 1.8 14.8 1 12 1 7.4 1 3.5 3.6 1.6 7.4l3.7 2.8C6.2 7.2 8.9 5 12 5z"/>
        <path fill="#4285F4" d="M23.5 12.3c0-.8-.1-1.6-.2-2.3H12v4.5h6.5c-.3 1.5-1.1 2.8-2.4 3.6l3.7 2.9c2.2-2 3.7-5 3.7-8.7z"/>
        <path fill="#FBBC05" d="M5.3 14.8c-.2-.8-.4-1.6-.4-2.5s.2-1.7.4-2.5L1.6 7C.6 9 0 11.2 0 13.5s.6 4.5 1.6 6.5l3.7-2.9z"/>
        <path fill="#34A853" d="M12 24c3.2 0 6-1.1 8-3l-3.7-2.9c-1.1.7-2.5 1.2-4.3 1.2-3.1 0-5.8-2.1-6.7-5l-3.7 2.8C3.5 21.4 7.4 24 12 24z"/>
      </svg>
      <span>Sign in with Google</span>
    </button>

    <div class="status-badge loading" id="statusBadge" style="display:none;">
      <span class="spinner" id="spinner"></span>
      <span id="statusMessage">Connecting to Google...</span>
    </div>

    <div class="action-group" id="actionGroup">
      <a href="#" class="primary-btn" id="openDesktopBtn">Open Zovio</a>
      <button type="button" class="secondary-btn" id="closeTabBtn">Close This Tab</button>
      <div class="auto-close-timer" id="autoCloseText"></div>
    </div>

    <p class="footer-note">End-to-End Encrypted &bull; Private & Secure</p>
  </div>

  <script>
    const fbConfig = {
      projectId: 'fireupp-d5c92',
      apiKey: 'AIzaSyAL82esHaHZ4J0uhuWOQJgBXqgsjfhap9c',
      authDomain: 'fireupp-d5c92.firebaseapp.com',
      storageBucket: 'fireupp-d5c92.firebasestorage.app',
      messagingSenderId: '438704653281',
      appId: '1:438704653281:web:20ed0dc1db7920ff52c8a0'
    };

    if (!firebase.apps.length) {
      firebase.initializeApp(fbConfig);
    }

    const urlParams = new URLSearchParams(window.location.search);
    const sessionId = urlParams.get('session') || '';
    const action = urlParams.get('action') || 'login';
    const emailHint = urlParams.get('email') || '';

    if (action === 'delete') {
      document.title = 'Confirm Fireupp Account Deletion';
      const h1 = document.querySelector('h1');
      if (h1) h1.innerText = 'Confirm Account Deletion';
      const sub = document.getElementById('subtitleText');
      if (sub) sub.innerText = 'Authenticate your Google account to confirm permanent deletion of your Fireupp account.';
      const loginBtnText = document.querySelector('#loginBtn span');
      if (loginBtnText) loginBtnText.innerText = 'Verify with Google to Delete Account';
      const openDesktopBtn = document.getElementById('openDesktopBtn');
      if (openDesktopBtn) openDesktopBtn.innerText = 'Return to Fireupp Desktop';
    } else if (action === 'drive') {
      document.title = 'Connect Google Drive Backup — Zovio';
      const h1 = document.querySelector('h1');
      if (h1) h1.innerText = 'Connect Google Drive Backup';
      const sub = document.getElementById('subtitleText');
      if (sub) sub.innerText = 'Grant Zovio private app-folder access to store your end-to-end encrypted chat & media backups in your personal Google Drive.';
      const loginBtnText = document.querySelector('#loginBtn span');
      if (loginBtnText) loginBtnText.innerText = 'Connect Google Drive';
      const openDesktopBtn = document.getElementById('openDesktopBtn');
      if (openDesktopBtn) openDesktopBtn.innerText = 'Return to Zovio Desktop';
    }

    const loginBtn = document.getElementById('loginBtn');
    const statusBadge = document.getElementById('statusBadge');
    const statusMessage = document.getElementById('statusMessage');
    const actionGroup = document.getElementById('actionGroup');
    const openDesktopBtn = document.getElementById('openDesktopBtn');
    const closeTabBtn = document.getElementById('closeTabBtn');
    const autoCloseText = document.getElementById('autoCloseText');
    const subtitleText = document.getElementById('subtitleText');

    function setStatus(msg, type = 'loading') {
      statusBadge.style.display = 'flex';
      statusBadge.className = `status-badge ${type}`;
      statusMessage.innerText = msg;
      const spin = document.getElementById('spinner');
      if (spin) spin.style.display = type === 'loading' ? 'inline-block' : 'none';
    }

    let countdownInterval = null;

    function startAutoCloseTimer(seconds = 15) {
      let remaining = seconds;
      autoCloseText.innerText = `This tab will automatically close in ${remaining}s...`;
      countdownInterval = setInterval(() => {
        remaining -= 1;
        if (remaining <= 0) {
          clearInterval(countdownInterval);
          try { window.close(); } catch (_) {}
        } else {
          autoCloseText.innerText = `This tab will automatically close in ${remaining}s...`;
        }
      }, 1000);
    }

    async function finalizeGoogleAuthResult(user, credential) {
      if (!user || !user.email) {
        throw new Error('No email returned from Google account.');
      }

      const idToken = await user.getIdToken();
      const driveAccessToken = action === 'drive' ? (credential?.accessToken || '') : '';
      if (action === 'drive' && !driveAccessToken) {
        throw new Error('Google Drive permission was not granted. Please allow app-folder access and try again.');
      }

      const payload = {
        email: user.email.toLowerCase().trim(),
        name: user.displayName || user.email.split('@')[0],
        uid: user.uid,
        token: idToken,
        avatar: user.photoURL || null,
        ...(action === 'drive' ? {
          driveAccessToken,
          expiresAt: Date.now() + 3400 * 1000
        } : {})
      };

      // 1. Instantly synchronize with desktop / mobile app via backend session store
      if (sessionId) {
        try {
          await fetch('/api/auth/desktop-session', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ session: sessionId, authData: { ...payload, action } })
          });
        } catch (syncErr) {
          console.warn('[desktop-auth] Session sync notice:', syncErr);
        }
      }

      const deepLink = `zovio://auth?data=${encodeURIComponent(JSON.stringify({ ...payload, action }))}`;

      if (action === 'delete') {
        setStatus(`Verified as ${user.email}! Account deletion in progress...`, 'success');
        subtitleText.innerText = 'Zovio is now confirming your account deletion.';
      } else if (action === 'drive') {
        setStatus(`Google Drive connected for ${user.email}!`, 'success');
        subtitleText.innerText = 'Encrypted backup permission saved. Returning to Zovio...';
      } else {
        setStatus(`Signed in as ${user.email}!`, 'success');
        subtitleText.innerText = 'Returning to Zovio and signing you in automatically.';
      }

      openDesktopBtn.href = deepLink;
      actionGroup.style.display = 'flex';

      // Trigger deep link to return automatically to Zovio Desktop or Zovio Android
      window.location.href = deepLink;

      startAutoCloseTimer(15);
    }

    function buildGoogleProvider() {
      const provider = new firebase.auth.GoogleAuthProvider();
      if (action === 'drive') {
        provider.addScope('https://www.googleapis.com/auth/drive.appdata');
        const customParams = { prompt: 'consent select_account' };
        if (emailHint) customParams.login_hint = emailHint;
        provider.setCustomParameters(customParams);
      } else {
        provider.setCustomParameters({ prompt: 'select_account' });
      }
      return provider;
    }

    async function triggerGoogleLogin() {
      loginBtn.style.display = 'none';
      setStatus('Waiting for Google authorization...', 'loading');

      try {
        const provider = buildGoogleProvider();
        const isMobile = /Android|iPhone|iPad|Mobile/i.test(navigator.userAgent || '');
        if (isMobile) {
          await firebase.auth().signInWithRedirect(provider);
          return;
        }
        try {
          const res = await firebase.auth().signInWithPopup(provider);
          await finalizeGoogleAuthResult(res.user, res.credential);
        } catch (popupErr) {
          if (
            popupErr?.code === 'auth/popup-blocked' ||
            popupErr?.code === 'auth/cancelled-popup-request' ||
            popupErr?.code === 'auth/operation-not-supported-in-this-environment'
          ) {
            await firebase.auth().signInWithRedirect(provider);
            return;
          }
          throw popupErr;
        }
      } catch (err) {
        console.error('Sign-in error:', err);
        loginBtn.style.display = 'inline-flex';
        setStatus(err.message || 'Google sign-in failed. Please try again.', 'error');
      }
    }

    loginBtn.onclick = triggerGoogleLogin;
    closeTabBtn.onclick = () => {
      if (countdownInterval) clearInterval(countdownInterval);
      try { window.close(); } catch (_) {}
    };

    // Complete redirect flow (on Android Chrome Custom Tabs) or auto-trigger on desktop
    window.addEventListener('DOMContentLoaded', async () => {
      try {
        const redirectRes = await firebase.auth().getRedirectResult();
        if (redirectRes && redirectRes.user) {
          loginBtn.style.display = 'none';
          await finalizeGoogleAuthResult(redirectRes.user, redirectRes.credential);
          return;
        }
      } catch (redErr) {
        console.warn('[auth] Redirect check notice:', redErr);
        loginBtn.style.display = 'inline-flex';
        setStatus(redErr?.message || 'Tap Continue with Google to sign in.', 'error');
        return;
      }

      const isMobile = /Android|iPhone|iPad|Mobile/i.test(navigator.userAgent || '');
      if (isMobile) {
        // Auto-launch Google redirect when opened directly from Android app
        setTimeout(() => {
          triggerGoogleLogin().catch(() => {});
        }, 180);
      } else {
        setTimeout(triggerGoogleLogin, 250);
      }
    });
  </script>
</body>
</html>
