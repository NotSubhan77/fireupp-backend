<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign in to Fireupp Desktop</title>
  <link rel="icon" type="image/svg+xml" href="/fireupp-logo.svg">
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: radial-gradient(circle at 50% 20%, #171929 0%, #0a0b12 100%);
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .auth-card {
      background: rgba(22, 25, 42, 0.75);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 24px;
      padding: 44px 36px;
      max-width: 440px;
      width: 100%;
      text-align: center;
      box-shadow: 0 24px 64px rgba(0, 0, 0, 0.6), 0 0 0 1px rgba(255, 255, 255, 0.08);
      animation: fadeIn 0.35s cubic-bezier(0.16, 1, 0.3, 1);
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(12px) scale(0.98); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }
    .logo-wrap {
      width: 64px;
      height: 64px;
      margin: 0 auto 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(255, 255, 255, 0.05);
      border-radius: 20px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      box-shadow: 0 8px 24px rgba(255, 59, 0, 0.25);
    }
    h1 {
      font-size: 24px;
      font-weight: 800;
      letter-spacing: -0.4px;
      margin-bottom: 8px;
    }
    .subtitle {
      font-size: 14px;
      color: #94a3b8;
      line-height: 1.5;
      margin-bottom: 28px;
    }
    .google-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      width: 100%;
      padding: 14px 20px;
      border-radius: 14px;
      border: 1px solid rgba(255, 255, 255, 0.18);
      background: #ffffff;
      color: #0f172a;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
      box-shadow: 0 4px 18px rgba(0, 0, 0, 0.3);
    }
    .google-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 28px rgba(255, 255, 255, 0.25);
    }
    .google-btn:active {
      transform: translateY(0);
    }
    .status-badge {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin-top: 20px;
      padding: 12px 16px;
      border-radius: 12px;
      font-size: 13.5px;
      line-height: 1.4;
    }
    .status-badge.loading {
      background: rgba(255, 255, 255, 0.06);
      color: #cbd5e1;
    }
    .status-badge.success {
      background: rgba(16, 185, 129, 0.15);
      border: 1px solid rgba(16, 185, 129, 0.3);
      color: #34d399;
      font-weight: 600;
    }
    .status-badge.error {
      background: rgba(239, 68, 68, 0.15);
      border: 1px solid rgba(239, 68, 68, 0.3);
      color: #f87171;
    }
    .spinner {
      width: 18px;
      height: 18px;
      border: 2.5px solid rgba(255, 255, 255, 0.2);
      border-top-color: #ff8c00;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    .open-btn {
      display: none;
      margin-top: 16px;
      width: 100%;
      padding: 12px 18px;
      border-radius: 12px;
      border: none;
      background: linear-gradient(135deg, #7c5cff 0%, #ff5c8a 100%);
      color: #ffffff;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      text-decoration: none;
      text-align: center;
      box-shadow: 0 4px 16px rgba(124, 92, 255, 0.4);
    }
    .open-btn:hover {
      opacity: 0.94;
    }
    .footer-note {
      margin-top: 24px;
      font-size: 12px;
      color: #64748b;
    }
  </style>
</head>
<body>
  <div class="auth-card">
    <div class="logo-wrap">
      <svg viewBox="0 0 36 36" width="38" height="38" fill="none">
        <defs>
          <linearGradient id="gL" x1="0" y1="36" x2="18" y2="2" gradientUnits="userSpaceOnUse">
            <stop offset="0%" stop-color="#ff3b00"/>
            <stop offset="55%" stop-color="#ff8c00"/>
            <stop offset="100%" stop-color="#ffea00"/>
          </linearGradient>
          <linearGradient id="gR" x1="12" y1="34" x2="32" y2="4" gradientUnits="userSpaceOnUse">
            <stop offset="0%" stop-color="#e91e63"/>
            <stop offset="45%" stop-color="#9c27b0"/>
            <stop offset="100%" stop-color="#673ab7"/>
          </linearGradient>
          <linearGradient id="gC" x1="18" y1="30" x2="18" y2="10" gradientUnits="userSpaceOnUse">
            <stop offset="0%" stop-color="#ff9800"/>
            <stop offset="40%" stop-color="#ffeb3b"/>
            <stop offset="100%" stop-color="#ffffff"/>
          </linearGradient>
        </defs>
        <path d="M18 3.5C14.2 8.2 9 14.5 9 22C9 27.5 13 32 18 32C15.2 29.5 14 26 14 22.8C14 17.5 17.2 13 18 3.5Z" fill="url(#gL)"/>
        <path d="M18 3.5C21.8 8.8 27 15 27 22.2C27 27.8 23 32 18 32C20.8 29.5 22 26 22 22.8C22 17.2 19 12.5 18 3.5Z" fill="url(#gR)" opacity="0.92"/>
        <path d="M18 10C16 15 13.5 19 13.5 23C13.5 27 15.5 29.5 18 29.5C20.5 29.5 22.5 27 22.5 23C22.5 19 20 15 18 10Z" fill="url(#gC)"/>
        <polygon points="18,17 20,22 18,25 16,22" fill="#ffffff"/>
      </svg>
    </div>

    <h1>Sign in to Fireupp</h1>
    <p class="subtitle" id="subtitleText">Authenticate your Google account to return to the native desktop application.</p>

    <button type="button" class="google-btn" id="loginBtn">
      <svg viewBox="0 0 24 24" width="20" height="20">
        <path fill="#EA4335" d="M12 5c1.6 0 3 .6 4.1 1.7l3.1-3.1C17.3 1.8 14.8 1 12 1 7.4 1 3.5 3.6 1.6 7.4l3.7 2.8C6.2 7.2 8.9 5 12 5z"/>
        <path fill="#4285F4" d="M23.5 12.3c0-.8-.1-1.6-.2-2.3H12v4.5h6.5c-.3 1.5-1.1 2.8-2.4 3.6l3.7 2.9c2.2-2 3.7-5 3.7-8.7z"/>
        <path fill="#FBBC05" d="M5.3 14.8c-.2-.8-.4-1.6-.4-2.5s.2-1.7.4-2.5L1.6 7C.6 9 0 11.2 0 13.5s.6 4.5 1.6 6.5l3.7-2.9z"/>
        <path fill="#34A853" d="M12 24c3.2 0 6-1.1 8-3l-3.7-2.9c-1.1.7-2.5 1.2-4.3 1.2-3.1 0-5.8-2.1-6.7-5l-3.7 2.8C3.5 21.4 7.4 24 12 24z"/>
      </svg>
      <span>Sign in with Google</span>
    </button>

    <div class="status-badge loading" id="statusBadge" style="display:none;">
      <span class="spinner" id="spinner"></span>
      <span id="statusMessage">Connecting to Google...</span>
    </div>

    <a href="#" class="open-btn" id="openDesktopBtn">Open Fireupp Desktop</a>

    <p class="footer-note">End-to-End Encrypted &bull; Private & Secure</p>
  </div>

  <script>
    const fbConfig = {
      projectId: 'fireupp-d5c92',
      apiKey: 'AIzaSyAL82esHaHZ4J0uhuWOQJgBXqgsjfhap9c',
      authDomain: 'fireupp-d5c92.firebaseapp.com',
      storageBucket: 'fireupp-d5c92.firebasestorage.app',
      messagingSenderId: '438704653281',
      appId: '1:438704653281:web:20ed0dc1db7920ff52c8a0'
    };

    if (!firebase.apps.length) {
      firebase.initializeApp(fbConfig);
    }

    const loginBtn = document.getElementById('loginBtn');
    const statusBadge = document.getElementById('statusBadge');
    const statusMessage = document.getElementById('statusMessage');
    const openDesktopBtn = document.getElementById('openDesktopBtn');
    const subtitleText = document.getElementById('subtitleText');

    function setStatus(msg, type = 'loading') {
      statusBadge.style.display = 'flex';
      statusBadge.className = `status-badge ${type}`;
      statusMessage.innerText = msg;
      const spin = document.getElementById('spinner');
      if (spin) spin.style.display = type === 'loading' ? 'inline-block' : 'none';
    }

    async function triggerGoogleLogin() {
      loginBtn.style.display = 'none';
      setStatus('Waiting for Google authorization...', 'loading');

      try {
        const provider = new firebase.auth.GoogleAuthProvider();
        provider.setCustomParameters({ prompt: 'select_account' });
        
        const res = await firebase.auth().signInWithPopup(provider);
        const user = res.user;
        if (!user || !user.email) {
          throw new Error('No email returned from Google account.');
        }

        const idToken = await user.getIdToken();
        const payload = {
          email: user.email.toLowerCase().trim(),
          name: user.displayName || user.email.split('@')[0],
          uid: user.uid,
          token: idToken,
          avatar: user.photoURL || null
        };

        const deepLink = `fireupp://auth?data=${encodeURIComponent(JSON.stringify(payload))}`;
        
        setStatus(`Signed in as ${user.email}! Returning to Fireupp...`, 'success');
        subtitleText.innerText = 'You are signed in! Returning to Fireupp Desktop now...';
        
        openDesktopBtn.href = deepLink;
        openDesktopBtn.style.display = 'block';

        // Deep link redirection to native app
        window.location.href = deepLink;

        // Auto close Chrome tab after 1.5 seconds
        setTimeout(() => {
          try {
            window.close();
          } catch (_) {}
        }, 1500);

      } catch (err) {
        console.error('Sign-in error:', err);
        loginBtn.style.display = 'inline-flex';
        setStatus(err.message || 'Google sign-in failed. Please try again.', 'error');
      }
    }

    loginBtn.onclick = triggerGoogleLogin;

    // Proactively start sign-in on page load for instantaneous 1-click UX
    window.addEventListener('DOMContentLoaded', () => {
      setTimeout(triggerGoogleLogin, 250);
    });
  </script>
</body>
</html>
